<!doctype html>
<!--
  Lo primero que ves al abrir CandidatAI: el acceso directo (y `cai start`) abren esta página nada
  más pulsarlo, desde el disco, mientras la app arranca. Pregunta a la app cada medio segundo y,
  en cuanto responde, pasa a ella; si tarda demasiado, ofrece reintentar. Sin nada externo: tiene que funcionar sin la app en marcha.
  El logo es el de `favicon.svg`, en línea para no depender de otro fichero.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CandidatAI</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f9f8;
        --fg: #10211f;
        --muted: #586866;
        --primary: #0f766e;
        --on-primary: #ffffff;
        --track: #dbe7e4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a1514;
          --fg: #ecf6f4;
          --muted: #93a8a5;
          --primary: #2dd4bf;
          --on-primary: #06201d;
          --track: #1b3330;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--fg);
        background: var(--bg);
        font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { width: min(380px, 100%); text-align: center; animation: rise 0.5s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

      /* El logo con un anillo que gira: el único indicador de espera. */
      .mark { position: relative; width: 96px; height: 96px; margin: 0 auto 28px; }
      .logo { position: absolute; inset: 20px; width: 56px; height: 56px; border-radius: 14px; }
      .ring { position: absolute; inset: 0; width: 100%; height: 100%; }
      .ring circle { fill: none; stroke-width: 2; }
      .ring .track { stroke: var(--track); }
      .ring .arc {
        stroke: var(--primary);
        stroke-linecap: round;
        stroke-dasharray: 72 200;
        transform-origin: 50% 50%;
        animation: spin 1.4s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0 auto; max-width: 36ch; color: var(--muted); }
      .second { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--track); }
      h2 { margin: 0 0 4px; font-size: 14px; font-weight: 600; color: var(--muted); }
      .second p { font-size: 13px; }

      button {
        margin-top: 22px;
        padding: 9px 18px;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: var(--on-primary);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease;
      }
      button:active { transform: scale(0.98); }
      button:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
      button[hidden] { display: none; }

      .slow .ring .arc { animation-duration: 2.4s; }
      .failed .ring .arc { animation: none; stroke: transparent; }
      .failed .logo { filter: grayscale(0.85); opacity: 0.8; }

      @media (prefers-reduced-motion: reduce) {
        main { animation: none; }
        .ring .arc { animation: pulse 2.4s ease-in-out infinite; stroke-dasharray: none; }
        @keyframes pulse { 50% { opacity: 0.25; } }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg class="ring" viewBox="0 0 96 96" focusable="false">
          <circle class="track" cx="48" cy="48" r="46" />
          <circle class="arc" cx="48" cy="48" r="46" />
        </svg>
        <svg class="logo" viewBox="0 0 64 64" focusable="false">
          <rect width="64" height="64" rx="14" fill="#0F766E" />
          <path d="M12 64 C12 47 20.5 40.5 32 40.5 C43.5 40.5 52 47 52 64 Z" fill="#FFFFFF" />
          <polygon points="32.00,9.40 34.74,11.76 38.30,11.09 39.50,14.50 42.91,15.70 42.24,19.26 44.60,22.00 42.24,24.74 42.91,28.30 39.50,29.50 38.30,32.91 34.74,32.24 32.00,34.60 29.26,32.24 25.70,32.91 24.50,29.50 21.09,28.30 21.76,24.74 19.40,22.00 21.76,19.26 21.09,15.70 24.50,14.50 25.70,11.09 29.26,11.76" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round" />
          <path d="M26.4 21.6 L30.4 25.6 L37.8 18.2" fill="none" stroke="#0F766E" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <section lang="es">
        <h1 id="title-es"></h1>
        <p id="body-es" role="status"></p>
      </section>
      <section lang="en" class="second">
        <h2 id="title-en"></h2>
        <p id="body-en"></p>
      </section>
      <button id="retry" type="button" hidden></button>
    </main>
    <script>
      var target = 'http://127.0.0.1:8000/' // la de siempre: con otro puerto, `cai start` no abre esta página
      // Los dos idiomas a la vez: esta página se abre desde el disco y no puede saber cuál usa la app.
      var text = {
        es: {
          title: 'Arrancando CandidatAI',
          body: 'Se abrirá sola en unos segundos.',
          slow: 'Está tardando más de lo normal. La primera vez tras instalar o actualizar puede llegar al minuto.',
          failedTitle: 'CandidatAI no ha arrancado',
          failed: 'Revisa la ventana de CandidatAI: si muestra un error, indica qué hacer.',
          retry: 'Reintentar',
        },
        en: {
          title: 'Starting CandidatAI',
          body: 'It will open on its own in a few seconds.',
          slow: 'This is taking longer than usual. The first start after installing or updating can take up to a minute.',
          failedTitle: 'CandidatAI didn’t start',
          failed: 'Check the CandidatAI window: if it shows an error, it says what to do.',
          retry: 'Try again',
        },
      }
      var retry = document.getElementById('retry')
      function show(titleKey, bodyKey) {
        ;['es', 'en'].forEach(function (l) {
          document.getElementById('title-' + l).textContent = text[l][titleKey]
          document.getElementById('body-' + l).textContent = text[l][bodyKey]
        })
      }
      show('title', 'body')
      retry.textContent = text.es.retry + ' / ' + text.en.retry

      var started = Date.now()
      function check() {
        var seconds = (Date.now() - started) / 1000
        if (seconds > 120) {
          document.body.className = 'failed'
          show('failedTitle', 'failed')
          retry.hidden = false
          return
        }
        if (seconds > 20) {
          document.body.className = 'slow'
          show('title', 'slow')
        }
        // `no-cors`: no hace falta leer la respuesta, basta con que la app conteste.
        fetch(target + 'status?_=' + Date.now(), { mode: 'no-cors', cache: 'no-store' })
          .then(function () { location.replace(target) })
          .catch(function () { setTimeout(check, 500) })
      }
      retry.addEventListener('click', function () {
        document.body.className = ''
        show('title', 'body')
        retry.hidden = true
        started = Date.now()
        check()
      })
      check()
    </script>
  </body>
</html>
