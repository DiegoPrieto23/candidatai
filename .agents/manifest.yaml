# Configuración para agentes: FUENTE ÚNICA de lo específico de cada herramienta.
# Tras editar cualquier cosa en .agents/, regenera desde la raíz del repo:
#   uv run scripts/sync_agents.py           # escribe .claude/, .codex/ y .mcp.json
#   uv run scripts/sync_agents.py --check   # CI: falla si lo generado no está al día
# Las rutas y formatos de cada agente cambian con el tiempo: si algo deja de cargar, se corrige aquí.

mcp_server:
  name: candidatai
  command: uv
  args: [run, --directory, backend, cai-mcp]
  env: {}

targets:
  claude:                         # Claude Code
    enabled: true
    skills_dir: .claude/skills    # copia de .agents/skills con extras de Claude
    agents_dir: .claude/agents
    mcp_file: .mcp.json
    models: {fast: haiku, capable: sonnet}
    launch:                       # botones «en tu agente» de la UI (ADR-024): sesión interactiva
      command: [claude, "{prompt}"]   # {prompt} = la orden del skill
      unset_env: [ANTHROPIC_API_KEY]  # sin clave de API, Claude Code usa tu suscripción
      resume: [claude, --resume, "{session_id}"]   # «Abrir en terminal» retoma una ejecución en segundo plano
      # «En segundo plano» (fase 19, ADR-032): sin ventana, desde el worker, para los skills que no
      # preguntan. {allowed_tools}: `allow`, el skill de la acción (`skill_rule`) y sus herramientas
      # MCP; {denied_tools}: TODAS las demás herramientas MCP de la app, porque un deny gana a
      # cualquier allow de .claude/settings.json y las quita también a los subagentes. Una por
      # argumento, con tools.mcp_prefix. Sin terminal ni web (--tools); Read solo sobre docs/ (el
      # redactor y el verificador leen POLICIES.md); dontAsk deniega lo que no esté permitido.
      headless:
        command:
          - claude
          - -p
          - "{prompt}"
          - --output-format
          - stream-json
          - --verbose
          - --permission-mode
          - dontAsk
          - --strict-mcp-config
          - --mcp-config
          - .mcp.json
          - --tools
          - Skill,Agent,Read
          - --disallowedTools
          - Read(./.env)
          - Read(./.env.*)
          - Read(./data/**)
          - Read(./data-demo/**)
          - "{denied_tools}"
          - --allowedTools
          - "{allowed_tools}"
        allow: [Agent, "Read(./docs/**)"]
        skill_rule: "Skill({skill})"   # solo el skill de la acción, no cualquiera de los instalados
        output: claude-stream-json     # formato de la salida que lee el worker
    tools:                        # herramientas lógicas → nombres nativos
      mcp_prefix: "mcp__candidatai__"
      read: [Read]
      search: [Grep, Glob]
      git_read: ["Bash(git diff *)", "Bash(git status *)", "Bash(git log *)"]
      web: [WebSearch, WebFetch]
      cai_profile_cli: ["Bash(uv run --directory backend cai profile *)"]
      cai_templates_cli: ["Bash(uv run --directory backend cai templates *)"]
      cai_context_cli: ["Bash(uv run --directory backend cai context *)"]
      cai_skills_cli: ["Bash(uv run --directory backend cai skills *)"]
    skill_extras:                 # campos de frontmatter que solo entiende Claude Code
      implement-phase:
        disable-model-invocation: true
        argument-hint: "[número de fase, p. ej. 03]"
      process-jobs:
        allowed-tools: ["mcp:get_status", "mcp:list_jobs"]
      assess-fit:
        allowed-tools: ["mcp:list_jobs", "mcp:get_match", "mcp:get_extraction", "mcp:get_profile", "mcp:get_context"]
      generate-cv:
        argument-hint: "[job_id o 'pendientes'] [opciones: con foto, sin foto, plantilla…]"
        allowed-tools: ["mcp:list_jobs", "mcp:check_job_open", "mcp:get_match", "mcp:get_extraction", "mcp:list_cv_templates", "mcp:render_cv"]
      generate-cover-letter:
        argument-hint: "[job_id] [indicaciones para esta carta]"
        allowed-tools: ["mcp:get_cover_letter", "mcp:get_extraction", "mcp:get_profile", "mcp:get_context", "mcp:get_cv_content"]
      prepare-application:
        argument-hint: "[job_id] [preguntas pegadas o 'carta']"
        allowed-tools: ["mcp:get_extraction", "mcp:get_profile", "mcp:get_cv_content"]
      # Entrevistas (fase 17): el plan y el repaso se guardan sin preguntar porque el skill ya pide
      # el OK del usuario antes (como save_message_draft). add_event (notas) no va: pide permiso.
      prepare-interview:
        argument-hint: "[job_id] [milestone_id] [rrhh|tecnica|caso|final]"
        allowed-tools: ["mcp:get_interviews", "mcp:get_extraction", "mcp:get_profile", "mcp:get_context", "mcp:get_timeline", "mcp:get_company_research", "mcp:save_interview_plan"]
      mock-interview:
        argument-hint: "[job_id] [milestone_id] [rrhh|tecnica|caso|final]"
        allowed-tools: ["read", "mcp:get_interviews", "mcp:get_extraction", "mcp:get_profile", "mcp:get_context"]
      debrief-interview:
        argument-hint: "[job_id] [milestone_id], o 'dudas' con una oferta recibida"
        allowed-tools: ["mcp:get_interviews", "mcp:get_extraction", "mcp:get_profile", "mcp:get_context", "mcp:get_timeline", "mcp:save_interview_notes"]
      update-profile:
        allowed-tools: ["read", "cai_profile_cli", "cai_context_cli", "cai_skills_cli"]
      daily-summary:
        allowed-tools: ["mcp:get_status", "mcp:list_followups_due", "mcp:list_upcoming", "mcp:list_jobs"]
      handle-requests:                   # fase 19: la cola de encargos que deja la UI
        argument-hint: "[nada para todos, o números de encargo]"
        allowed-tools: ["mcp:list_agent_requests"]
      import-cv-template:
        argument-hint: "[ruta en data/uploads/, p. ej. data/uploads/mi-cv.pdf]"
        allowed-tools: ["read", "cai_templates_cli"]
      search-jobs:
        argument-hint: "[configurar | plataforma | nada para todas]"
        allowed-tools: ["mcp:get_profile", "mcp:list_sources"]
      review-linkedin:
        argument-hint: "[ruta al PDF de LinkedIn o nada para pegar el texto]"
        allowed-tools: ["read", "mcp:get_profile", "mcp:list_jobs", "mcp:get_extraction"]
      review-replies:
        argument-hint: "[nada para todas, o un reply_id]"
        allowed-tools: ["mcp:list_replies"]
      draft-follow-up:
        argument-hint: "[nada para todo lo pendiente, o un job_id]"
        allowed-tools: ["mcp:list_followups_due", "mcp:get_profile", "mcp:get_context", "mcp:get_extraction", "mcp:get_timeline", "mcp:save_message_draft"]
      # Fase 18: el agente redacta o investiga; nada se envía. El borrador y el dosier se guardan
      # sin preguntar porque el skill ya enseña el texto antes (como save_message_draft).
      draft-message:
        argument-hint: "[job_id] [a quién: nombre, recruiter, responsable o compañero] [linkedin|correo]"
        allowed-tools: ["mcp:get_job_contacts", "mcp:get_extraction", "mcp:get_profile", "mcp:get_context", "mcp:get_company_research", "mcp:get_cv_content", "mcp:get_cover_letter", "mcp:save_message_draft"]
      research-company:
        argument-hint: "[job_id] [en qué fijarte]"
        allowed-tools: ["web", "mcp:get_company_research", "mcp:get_extraction", "mcp:save_company_research"]
      training-plan:
        argument-hint: "[nada para el plan, o URL o descripción de un curso o proyecto a valorar]"
        allowed-tools: ["read", "web", "mcp:get_skill_gaps", "mcp:get_profile", "mcp:get_context"]
      broaden-search:
        argument-hint: "[nada para los últimos 90 días, o un número de días]"
        allowed-tools: ["read", "cai_profile_cli", "mcp:get_search_titles", "mcp:get_profile", "mcp:list_sources"]
      # Fase 20: retrospectiva. Solo lee: los pesos y filtros los cambia el usuario.
      review-search:
        argument-hint: "[nada para la última semana, o un número de días]"
        allowed-tools: ["read", "mcp:get_calibration", "mcp:get_funnel_stats"]
      # Fase 21: el agente nunca recibe el mínimo ni los importes privados (get_received_offer).
      prepare-negotiation:
        argument-hint: "[job_id] [en qué centrarse, o 'contrato']"
        allowed-tools: ["read", "mcp:get_received_offer", "mcp:get_extraction", "mcp:get_interviews", "mcp:get_profile", "mcp:get_context"]

  codex:                          # Codex (ChatGPT): CLI, extensión IDE o app
    enabled: true
    skills_dir: null              # Codex lee .agents/skills directamente
    agents_dir: .codex/agents
    config_file: .codex/config.toml
    models: {fast: null, capable: null}   # null = hereda el modelo de la sesión; pon aquí los de tu plan
    launch:                       # botones «en tu agente» de la UI (ADR-024): sesión interactiva
      command: [codex, "{prompt}"]
      unset_env: [OPENAI_API_KEY]     # sin clave de API, Codex usa tu sesión de ChatGPT
    # Codex no permite limitar herramientas por subagente: se aplica sandbox_mode del rol.
    # Los subagentes heredan la política de la sesión padre (ver docs/AGENTS_COMPAT.md, nivel B).
