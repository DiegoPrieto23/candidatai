# Reglas genéricas de Job Hunter. Sin datos personales: lo tuyo va en data/profile.yaml → preferences.
# Los valores son puntos de partida; ajústalos con el set de evaluación (jh eval matching).

dedup:
  fuzzy_title_threshold: 90        # rapidfuzz token_set_ratio, misma empresa
  fuzzy_window_days: 60

hard_filters:
  years_tolerance: 1               # años exigidos por encima de preferences.max_years_required
  unknown_remote_mode_passes: true # si la oferta no dice la modalidad, no se descarta por eso
  discard_title_keywords: []       # p. ej. ["sales", "comercial", "prácticas"]

scoring:
  weights:
    must_have_coverage: 0.45
    semantic_similarity: 0.30
    preferences_fit: 0.15          # tipo de puesto, modalidad y zona según prioridad
    nice_to_have_coverage: 0.10
  level_weights: {F: 1.0, "C+": 0.8, C: 0.5, B: 0.2}
  triage_threshold: 55             # por debajo, la oferta se muestra atenuada en triaje
  semantic:                        # embeddings locales (extra `matching`; ADR-006)
    model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    similarity_floor: 0.15         # similitud coseno que cuenta como 0
    similarity_ceiling: 0.75       # similitud coseno que cuenta como 1
  preferences:
    role_min_similarity: 60        # token_sort_ratio con preferences.roles para contar; además, todas las palabras del rol deben estar en el título

followups:                      # fase 10: aviso de seguimiento y `list_followups_due`
  days_without_reply: 10          # días sin respuesta tras enviar (o tras el último seguimiento)
  max_followups: 2                # fase 15: tras 2 seguimientos enviados, deja de proponer más
  thank_you_days: 3               # fase 15: agradecer una entrevista hecha en los últimos N días

replies:                        # fase 15: respuestas de las empresas (IMAP en solo lectura o data/inbox/respuestas/)
  max_days: 120                   # como mucho, se buscan correos de los últimos N días (y nunca antes del envío)
  max_body_chars: 20000           # lo que se guarda del cuerpo de cada correo
  # Correos de ATS en nombre de la empresa: casan si su nombre sale en el remitente o el asunto.
  ats_sender_domains:
    - greenhouse.io
    - greenhouse-mail.io
    - lever.co
    - ashbyhq.com
    - myworkday.com
    - myworkdayjobs.com
    - smartrecruiters.com
    - teamtailor.com
    - teamtailor-mail.com
    - personio.de
    - personio.com
    - recruitee.com
    - workablemail.com
    - workable.com
    - jobvite.com
    - icims.com
    - successfactors.com
    - successfactors.eu
    - taleo.net
    - bamboohr.com
    - breezy.hr
    - join.com
    - factorialhr.com
  # Avisos de portales («tu candidatura ha sido vista/descartada»). Vacío: no se leen. Si añades
  # p. ej. infojobs.net, casan igual que los ATS (empresa en el remitente o el asunto).
  portal_sender_domains: []
  # Correo personal: con estos dominios solo casa la dirección exacta de un contacto de la ficha.
  personal_mail_domains: [gmail.com, googlemail.com, outlook.com, hotmail.com, hotmail.es, live.com, yahoo.com, yahoo.es, icloud.com, me.com, proton.me, protonmail.com, gmx.com, gmx.es]

calendar:                       # fase 10: hitos de los procesos y feed .ics
  timezone: Europe/Madrid
  default_duration_minutes: 60    # duración de un hito sin hora de fin

applier:                        # fase 11: candidatura asistida (rellena y espera tu confirmación)
  step_timeout_seconds: 30        # cada paso del navegador (cargar, rellenar un campo, capturar)
  confirm_wait_seconds: 30        # tras pulsar «Enviar», cuánto se espera la página de confirmación
  token_ttl_seconds: 300          # validez de la confirmación de envío (un solo uso)
  answer_min_similarity: 85       # token_set_ratio entre la pregunta del formulario y la del paquete

cv:
  fallback_template: ats-simple
  # ATS reconocidos por la URL de la oferta. Se usan en template_rules y para el aviso
  # not_ats_friendly. Amplía la lista cuando veas otros.
  ats_platforms:
    workday: [myworkdayjobs.com, workday.com]
    taleo: [taleo.net]
    successfactors: [successfactors.com, successfactors.eu, jobs.sap.com]
    icims: [icims.com]
    greenhouse: [greenhouse.io]
    lever: [lever.co]
    ashby: [ashbyhq.com]
    smartrecruiters: [smartrecruiters.com]
    teamtailor: [teamtailor.com]
    personio: [jobs.personio.de, jobs.personio.com]
  pdf_timeout_seconds: 60

cover_letter:                   # fase 08c; manda preferences.cover_letter del perfil y, encima, la oferta
  max_words: 180
  fallback_template: carta-simple

connectors:                     # fase 09: APIs de ATS (Greenhouse, Lever, Ashby) y portales
  daily_at: "07:30"               # hora local a la que `jh worker` ejecuta las fuentes activas
  timezone: Europe/Madrid
  timeout_seconds: 20
  max_jobs_per_source: 500        # por ejecución; lo que pase de ahí se ignora con un aviso

email_alerts:                  # fase 09b
  poll_minutes: 60
  summary_expire_days: 21
  # Remitentes por plataforma: se completan en la fase 09b con alertas reales del usuario.
  platforms:
    linkedin: [linkedin.com]
    infojobs: [infojobs.net]
    indeed: [indeed.com, indeed.es]
    tecnoempleo: [tecnoempleo.com]

agent_browse:                   # fase 09b, skill buscar-ofertas
  max_result_pages: 2
  delay_seconds: 5
  default_max_offers: 15
