# Reglas genéricas de CandidatAI. Sin datos personales: lo tuyo va en data/profile.yaml → preferences.
# Los valores son puntos de partida; ajústalos con el set de evaluación (cai eval matching).

dedup:
  fuzzy_title_threshold: 90        # rapidfuzz token_set_ratio, misma empresa
  fuzzy_window_days: 60

hard_filters:
  years_tolerance: 1               # años exigidos por encima de preferences.max_years_required
  unknown_remote_mode_passes: true # si la oferta no dice la modalidad, no se descarta por eso
  discard_title_keywords: []       # p. ej. ["sales", "comercial", "prácticas"]

scoring:
  weights:
    must_have_coverage: 0.45
    semantic_similarity: 0.30
    preferences_fit: 0.15          # tipo de puesto, modalidad y zona según prioridad
    nice_to_have_coverage: 0.10
  level_weights: {F: 1.0, "C+": 0.8, C: 0.5, B: 0.2}
  triage_threshold: 55             # por debajo, la oferta se muestra atenuada en triaje
  semantic:                        # embeddings locales (extra `matching`; ADR-006)
    model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    similarity_floor: 0.15         # similitud coseno que cuenta como 0
    similarity_ceiling: 0.75       # similitud coseno que cuenta como 1
  preferences:
    role_min_similarity: 60        # token_sort_ratio con preferences.roles para contar; además, todas las palabras del rol deben estar en el título

followups:                      # fase 10: aviso de seguimiento y `list_followups_due`
  days_without_reply: 10          # días sin respuesta tras enviar (o tras el último seguimiento)
  max_followups: 2                # fase 15: tras 2 seguimientos enviados, deja de proponer más
  thank_you_days: 3               # fase 15: agradecer una entrevista hecha en los últimos N días

replies:                        # fase 15: respuestas de las empresas (IMAP en solo lectura o data/inbox/respuestas/)
  max_days: 120                   # como mucho, se buscan correos de los últimos N días (y nunca antes del envío)
  max_body_chars: 20000           # lo que se guarda del cuerpo de cada correo
  # Correos de ATS en nombre de la empresa: casan si su nombre sale en el remitente o el asunto.
  ats_sender_domains:
    - greenhouse.io
    - greenhouse-mail.io
    - lever.co
    - ashbyhq.com
    - myworkday.com
    - myworkdayjobs.com
    - smartrecruiters.com
    - teamtailor.com
    - teamtailor-mail.com
    - personio.de
    - personio.com
    - recruitee.com
    - workablemail.com
    - workable.com
    - jobvite.com
    - icims.com
    - successfactors.com
    - successfactors.eu
    - taleo.net
    - bamboohr.com
    - breezy.hr
    - join.com
    - factorialhr.com
  # Avisos de portales («tu candidatura ha sido vista/descartada»). Vacío: no se leen. Si añades
  # p. ej. infojobs.net, casan igual que los ATS (empresa en el remitente o el asunto).
  portal_sender_domains: []
  # Correo personal: con estos dominios solo casa la dirección exacta de un contacto de la ficha.
  personal_mail_domains: [gmail.com, googlemail.com, outlook.com, hotmail.com, hotmail.es, live.com, yahoo.com, yahoo.es, icloud.com, me.com, proton.me, protonmail.com, gmx.com, gmx.es]

calendar:                       # fase 10: hitos de los procesos y feed .ics
  timezone: Europe/Madrid
  default_duration_minutes: 60    # duración de un hito sin hora de fin

applier:                        # fase 11: candidatura asistida (rellena y espera tu confirmación)
  step_timeout_seconds: 30        # cada paso del navegador (cargar, rellenar un campo, capturar)
  confirm_wait_seconds: 30        # tras pulsar «Enviar», cuánto se espera la página de confirmación
  token_ttl_seconds: 300          # validez de la confirmación de envío (un solo uso)
  answer_min_similarity: 85       # token_set_ratio entre la pregunta del formulario y la del paquete

cv:
  fallback_template: ats-simple
  # ATS reconocidos por la URL de la oferta. Se usan en template_rules y para el aviso
  # not_ats_friendly. Amplía la lista cuando veas otros.
  ats_platforms:
    workday: [myworkdayjobs.com, workday.com]
    taleo: [taleo.net]
    successfactors: [successfactors.com, successfactors.eu, jobs.sap.com]
    icims: [icims.com]
    greenhouse: [greenhouse.io]
    lever: [lever.co]
    ashby: [ashbyhq.com]
    smartrecruiters: [smartrecruiters.com]
    teamtailor: [teamtailor.com]
    personio: [jobs.personio.de, jobs.personio.com]
  pdf_timeout_seconds: 60

cover_letter:                   # fase 08c; manda preferences.cover_letter del perfil y, encima, la oferta
  max_words: 180
  fallback_template: carta-simple

connectors:                     # fase 09: APIs de ATS (Greenhouse, Lever, Ashby) y portales
  daily_at: "07:30"               # hora local a la que `cai worker` ejecuta las fuentes activas
  timezone: Europe/Madrid
  timeout_seconds: 20
  max_jobs_per_source: 500        # por ejecución; lo que pase de ahí se ignora con un aviso

email_alerts:                  # fase 09b
  poll_minutes: 60
  summary_expire_days: 21
  # Remitentes por plataforma: se completan en la fase 09b con alertas reales del usuario.
  platforms:
    linkedin: [linkedin.com]
    infojobs: [infojobs.net]
    indeed: [indeed.com, indeed.es]
    tecnoempleo: [tecnoempleo.com]

agent_browse:                   # fase 09b, skill search-jobs
  max_result_pages: 2
  delay_seconds: 5
  default_max_offers: 15

linkedin_public:                # fase 22, ADR-033: búsqueda pública de LinkedIn sin sesión, apagada por defecto
  max_searches_per_run: 5         # búsquedas (search_urls de la plataforma LinkedIn) por ejecución
  max_pages_per_search: 2         # páginas de resultados por búsqueda (unas 10 ofertas cada una)
  delay_seconds: 10               # pausa entre dos peticiones cualesquiera; no se admite menos de 10
  min_hours_between_runs: 20      # como mucho, una ejecución al día
  block_cooldown_days: 3          # tras un 429/999, redirección o captcha, días sin volver a intentarlo
  max_details_per_run: 10         # descripciones por ejecución, solo si activas «Descargar también la descripción»
  timeout_seconds: 20
  default_time_posted: r86400     # si la búsqueda no dice `f_TPR`: publicadas en las últimas 24 h

liveness:                       # fase 16: ¿sigue abierta? Nunca cierra la oferta: avisa y propone descartarla
  fresh_hours: 20                 # no se vuelve a comprobar antes (salvo «Comprobar otra vez»); el worker revisa cada día las aprobadas y con CV
  timeout_seconds: 15
  max_bytes: 2000000              # lo que se lee de la página, como mucho
  # Frases de «oferta cerrada» por portal (se comparan sin tildes ni mayúsculas con el texto visible).
  # Son heurísticas: si ves una oferta cerrada que no se detecta, añade aquí la frase que muestra.
  closed_phrases:
    any:
      - this job is no longer available
      - this position is no longer available
      - this job posting is no longer available
      - no longer accepting applications
      - this job has expired
      - the job you are looking for is no longer
      - esta oferta ya no esta disponible
      - esta oferta ya no esta activa
      - esta oferta ha caducado
      - esta oferta ha expirado
      - esta oferta esta cerrada
      - la oferta ha finalizado
      - ya no se aceptan candidaturas
      - este puesto ya no esta disponible
    infojobs:
      - la oferta que buscas ya no esta disponible
      - esta oferta ya no admite inscripciones
      - oferta caducada
    indeed:
      - esta oferta de empleo ha caducado
      - this job has expired on indeed
      - esta oferta ha caducado en indeed
    tecnoempleo:
      - oferta caducada
      - oferta no disponible
  # Controles anti-bot servidos con HTTP 200 (no dicen nada de la oferta): la comprobación da «no se sabe».
  blocked_phrases:
    - no podemos identificar tu navegador
    - to regain access please make sure that cookies and javascript are enabled
    - verify you are human
    - verifica que eres humano
    - checking your browser before accessing
    - enable javascript and cookies to continue
    - please complete the security check

reposts:                        # fase 16: «Republicada ×N» (observación, no veredicto)
  window_days: 90                 # se cuentan las publicaciones de los últimos N días
  min_count: 2                    # días distintos con una publicación nueva (otro id o URL) en el mismo canal

doubtful:                       # fase 25.3: señales de oferta dudosa (observaciones: no cambian el score ni los filtros)
  salary_range_max_pct: 60        # `salary_range_wide` si el máximo supera al mínimo en más de este %
  stale_repost_min_count: 4       # `stale_repost`: días distintos con una publicación nueva en el mismo canal…
  stale_repost_min_span_days: 60  # …o días entre la primera y la última vez vista (todo el historial)
                                  # patrones de agencias, empresas ocultas y cribado con IA: config/doubtful_patterns.yaml

layout:                         # fase 25.5: maquetación del PDF del CV y la carta (avisos, nunca bloqueos)
  enabled: true
  orphan_bottom_pct: 10           # `orphan_heading`: un título en el último 10 % de una página y su contenido en la siguiente
  large_gap_pct: 15               # `large_gap`: un hueco vertical mayor que el 15 % de la página en medio del documento
  bottom_margin_pct: 8            # margen normal al pie (no cuenta como hueco)
  footer_zone_pct: 3              # `footer_overlap`: texto en el último 3 % de la página…
  edge_margin_pt: 14              # …o a menos de 14 pt de un borde
  last_page_min_pct: 15           # `nearly_empty_last_page`: la última página ocupa menos del 15 % (con más de una)

profile_editing:                # fase 25.7: «Mi perfil» editable desde la UI
  history_keep: 20                # copias de data/profile.yaml en data/profile-history/ antes de cada guardado
  style_max_files: 10             # muestras de estilo en data/documentos/estilo/
  style_max_upload_mb: 5          # tamaño máximo de cada muestra (.txt, .md, .docx, .pdf)
  style_max_text_kb: 20           # texto de todas las muestras juntas que recibe el agente (get_context)

background_runs:                # fase 19: «En segundo plano» (el agente sin ventana desde el worker)
  timeout_minutes: 30             # después se para el proceso y la ejecución queda `timeout`
  max_progress_lines: 200         # líneas de progreso que se guardan (las últimas)
  max_parallel: 1                 # fase 25.4: ejecuciones a la vez (1-4); nunca dos de la misma oferta ni dos lotes de la misma acción
  per_agent: {}                   # tope por agente, p. ej. {opencode: 1} si usas un modelo local de Ollama
  assess_min_score: null          # «Evaluar encaje» en segundo plano solo valora desde este score (null: el de triaje menos 10; la página «Agente» lo cambia)
