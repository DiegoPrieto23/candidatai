# Equivalencias de puestos entre idiomas. Cada entrada es el puesto en inglés y, debajo, otras
# formas de escribirlo (sobre todo en español). Se usan en los dos sentidos: un título de oferta
# y un puesto o una palabra de tu búsqueda se comparan en inglés, así que «Ingeniero de datos»
# casa con «Data Engineer» y al revés. Valen para el filtro previo, los filtros duros, el encaje
# por título y los títulos de `broaden-search`.
#
# Se compara sin tildes, mayúsculas ni signos y por frases completas: «Ingeniero/a de Datos» se
# lee como «ingeniero a de datos», y una palabra suelta como «datos» no traduce nada. Amplíalo
# si ves títulos que no casan con tus puestos.

