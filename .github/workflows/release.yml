name: Release

# Al publicar una etiqueta `v*` (p. ej. `git tag v0.2.0 && git push origin v0.2.0`), compila la UI y
# publica `candidatai.zip`: el repositorio (sin datos: `data/` no está en git) más `frontend/dist`,
# y su suma `candidatai.zip.sha256`, que los instaladores comprueban antes de abrirlo (fase 28.1).
# Es lo que descargan `install.ps1` (fase 23.4) e `install.sh` (fase 26.2, va dentro con su permiso
# de ejecución). Las notas de la release son la sección de esa versión
# en `CHANGELOG.md` (fase 25.6): sin ella, la release falla antes de compilar nada.
#
# Prueba en seco: «Run workflow» en Actions, en la rama que quieras, con una versión (p. ej.
# `v0.1.0`). Usa el CHANGELOG de esa rama; la etiqueta solo elige qué sección sacar y no hace falta
# que exista. Escribe las notas en el resumen, compila y comprueba `candidatai.zip` (fase 26.4) y lo
# deja como artefacto de la ejecución, sin publicar nada.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Versión cuyas notas se prueban (p. ej. v0.1.0). No publica nada."
        required: true

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notas de la release desde CHANGELOG.md
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/release_notes.py "$TAG" > release-notes.md
          { echo "## Notas de $TAG"; echo; cat release-notes.md; } >> "$GITHUB_STEP_SUMMARY"

  # Empaqueta y comprueba el zip con permisos de solo lectura; lo deja como artefacto (fase 26.4).
  package:
    needs: notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Compila la UI
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Empaqueta candidatai.zip
        run: |
          git archive --format=zip --prefix=candidatai/ -o candidatai.zip HEAD
          mkdir -p stage/candidatai/frontend
          cp -r frontend/dist stage/candidatai/frontend/dist
          (cd stage && zip -qr ../candidatai.zip candidatai/frontend/dist)
          unzip -l candidatai.zip | grep -q "candidatai/frontend/dist/index.html"
          unzip -l candidatai.zip | grep -q "candidatai/install.sh"
          unzip -l candidatai.zip | grep -q "candidatai/frontend/public/candidatai.icns"
          # install.sh tiene que llegar ejecutable (`curl | bash` no lo necesita; `bash install.sh` sí
          # desde el zip descomprimido en macOS y Linux).
          zipinfo candidatai.zip candidatai/install.sh | grep -q "^-rwx"
      # Formato de `sha256sum` («<suma>  candidatai.zip»): lo leen install.ps1 e install.sh.
      - name: Suma SHA-256
        run: |
          sha256sum candidatai.zip > candidatai.zip.sha256
          sha256sum -c candidatai.zip.sha256
          { echo "## SHA-256"; echo; echo '```'; cat candidatai.zip.sha256; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Deja el zip como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: candidatai-zip
          path: |
            candidatai.zip
            candidatai.zip.sha256
          retention-days: 7

  # Solo con la etiqueta: el único job con permiso de escritura, y en la prueba en seco no existe.
  release:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: candidatai-zip
      - name: Publica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
          sha256sum -c candidatai.zip.sha256
          gh release create "$GITHUB_REF_NAME" candidatai.zip candidatai.zip.sha256 --title "CandidatAI $GITHUB_REF_NAME" --notes-file release-notes.md
