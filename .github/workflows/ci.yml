name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    # Windows 11 es el entorno principal: el backend se prueba ahí.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # Motor html de plantillas (fase 08b): sin Chromium, sus tests se saltarían.
      - run: uv run playwright install chromium
      - run: uv run ruff check
      - run: uv run ruff format --check
      # La lógica vive en services/: ahí se exige cobertura mínima (criterio de la fase 02).
      - run: uv run pytest --cov=app/services --cov-report=term-missing --cov-fail-under=85
      # Modo demo (fase 12.1): un clon limpio debe poder sembrar la demo. Sin LibreOffice, los PDF
      # de los CVs salen con el Chromium de Playwright instalado arriba.
      - name: Demo de humo
        shell: pwsh
        run: |
          $out = uv run jh demo seed --dir "$env:RUNNER_TEMP/data-demo" --compat --eval-cv --json
          if ($LASTEXITCODE -ne 0) { throw "jh demo seed falló: $out" }
          $summary = ($out -join "`n") | ConvertFrom-Json
          if ($summary.jobs -ne 70 -or $summary.cvs -ne 2) { throw "Demo incompleta: $out" }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  agents:
    # La configuración generada (.claude/, .codex/, .mcp.json) debe estar al día con .agents/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run scripts/sync_agents.py --check
