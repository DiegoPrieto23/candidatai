<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Job Hunter — Your job search, end to end, on your own machine.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3D3A"/>
      <stop offset="0.55" stop-color="#0F6E69"/>
      <stop offset="1" stop-color="#14897F"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <circle cx="1130" cy="70" r="190" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="1180" cy="300" r="120" fill="#ffffff" fill-opacity="0.04"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <g transform="translate(96,70)">
      <rect width="76" height="76" rx="18" fill="#ffffff"/>
      <text x="38" y="50" text-anchor="middle" font-size="32" font-weight="800" fill="#0F6E69">JH</text>
    </g>
    <text x="196" y="122" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">Job Hunter</text>
    <text x="96" y="194" font-size="28" font-weight="600" fill="#ffffff">Your job search, end to end, on your own machine.</text>
    <text x="96" y="230" font-size="19" fill="#D7F2EE">Your AI agent does the thinking. The app keeps the state, the rules and the checks.</text>
    <g transform="translate(96,262)"><rect width="76" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/><text x="38" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Find</text></g><path d="M180 282 h18 m-6 -6 l6 6 l-6 6" stroke="#5FC8BD" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(206,262)"><rect width="97" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/><text x="48" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Triage</text></g><path d="M311 282 h18 m-6 -6 l6 6 l-6 6" stroke="#5FC8BD" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(337,262)"><rect width="128" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/><text x="64" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Tailor CV</text></g><path d="M474 282 h18 m-6 -6 l6 6 l-6 6" stroke="#5FC8BD" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(500,262)"><rect width="86" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/><text x="43" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Apply</text></g><path d="M594 282 h18 m-6 -6 l6 6 l-6 6" stroke="#5FC8BD" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(620,262)"><rect width="128" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/><text x="64" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Follow up</text></g><path d="M756 282 h18 m-6 -6 l6 6 l-6 6" stroke="#5FC8BD" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(782,262)"><rect width="86" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/><text x="43" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Offer</text></g>
  </g>
  <g transform="translate(1010,110)" font-family="'Cascadia Code', Consolas, 'SF Mono', monospace" font-size="15" fill="#D7F2EE" fill-opacity="0.9">
    <rect x="-24" y="-34" width="230" height="132" rx="12" fill="#06201E" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.15"/>
    <text y="0"><tspan fill="#5FC8BD">$</tspan> jh status</text>
    <text y="26">pending_triage  <tspan fill="#ffffff">8</tspan></text>
    <text y="50">cv_ready        <tspan fill="#ffffff">2</tspan></text>
    <text y="74">in_process      <tspan fill="#ffffff">6</tspan></text>
  </g>
</svg>
