<!doctype html>
<!-- Inventado: Workday tras pasar de una oferta a otra sin recargar. El JSON-LD sigue siendo el de
     la primera; la cabecera y la descripción, de la que tienes delante. -->
<html lang="en">
  <head>
    <title>Data Analyst</title>
    <script type="application/ld+json">
      { "@type": "JobPosting", "title": "Primera Oferta Antigua", "hiringOrganization": { "name": "Compañía Demo Tecnológica" },
        "description": "<p>La descripción de la primera oferta, que no es esta.</p>" }
    </script>
  </head>
  <body>
    <div data-automation-id="jobPostingPage">
      <h2 data-automation-id="jobPostingHeader">Data Analyst</h2>
      <div data-automation-id="locations"><dt>locations</dt><dd>Spain, Madrid</dd></div>
      <div data-automation-id="jobPostingDescription"><p>Analiza los datos de la empresa demo con SQL y Python.</p></div>
    </div>
  </body>
</html>
