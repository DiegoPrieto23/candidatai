     cadenas y entidades HTML, y aun así se lee. -->

  <head>
    <title>Oferta de trabajo Technical Lead (Híbrido) - ticjob</title>

{
  "@context": "https://schema.org/",
  "@type": "JobPosting",
  "title" : "Technical Lead (H&iacute;brido)",
  "description" : "

Liderarás un equipo pequeño.
  ",
  "hiringOrganization" : { "@type": "Organization", "name": "Grupo Demo Digital" },
  "jobLocation" : { "@type": "Place", "address": { "addressLocality": "Málaga" } }
}

  </head>

    <div class="jobCompanyDescContainer"><p>Somos un grupo de empresas de demostración.</p></div>

</html>
