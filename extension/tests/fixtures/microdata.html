<!doctype html>
<!-- Inventado: oferta con microdatos de schema.org (como JobFluent o SmartRecruiters), sin JSON-LD. -->
<html lang="es">
  <head><title>Empleo Data Scientist en Empresa Demo | Portal Demo</title></head>
  <body>
    <main itemscope itemtype="http://schema.org/JobPosting">
      <h1><span itemprop="title">Data Scientist</span> en Barcelona</h1>
      <div itemprop="hiringOrganization" itemscope itemtype="http://schema.org/Organization"><span itemprop="name">Empresa Demo Analítica</span></div>
      <div itemprop="jobLocation" itemscope itemtype="http://schema.org/Place">
        <div itemprop="address" itemscope><span itemprop="addressLocality">Barcelona</span><meta itemprop="addressRegion" content="Cataluña" /></div>
      </div>
      <div itemprop="description"><p>Modelos de predicción de demanda.</p></div>
      <div itemprop="qualifications"><ul><li>Python y estadística</li></ul></div>
    </main>
  </body>
</html>
