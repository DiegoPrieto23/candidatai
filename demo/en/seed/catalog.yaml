# Platforms where the agent searches with your browser (`agent_browse`, phase 16). LinkedIn is
# created turned off, as from the UI.
platforms:
  - name: Indeed
    platform: indeed
    search_urls:
      - https://ie.indeed.com/jobs?q=data+engineer&l=Dublin
      - https://ie.indeed.com/jobs?q=analytics+engineer&l=Ireland&remotejob=1
    priority: 1
  - name: IrishJobs
    platform: irishjobs
    search_urls:
      - https://www.irishjobs.ie/jobs/data-engineer/in-dublin
    priority: 2
  - name: Jobs.ie
    platform: jobsie
    search_urls:
      - https://www.jobs.ie/data-engineer-jobs
    priority: 3
    access: login
  - name: LinkedIn
    platform: linkedin
    search_urls:
      - https://www.linkedin.com/jobs/search/?keywords=data%20engineer&location=Ireland
    priority: 4
    access: login
