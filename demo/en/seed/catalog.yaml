# FICTITIOUS catalogue for `cai demo seed --lang en` (phase 23.5b). Made-up companies, people and
# jobs, in Ireland. Same structure as demo/seed/catalog.yaml; the jobs are checked against
# demo/en/profile.example.yaml.

posting_language: en
second_language: {language: English, level: C1}   # what 40% of the jobs ask for
job_url: "https://jobs.example.com/{company}/jobs/{n}"

# Names of the sources the services create, in the demo's language.
source_names:
  manual_url: Added by URL
  manual_text: Added as pasted text
  email_alerts: Email alerts
  browser_capture: “Send to CandidatAI” button

# Fixed texts of the demo's history.
texts:
  expired: The job was taken down from the board.
  followup: Follow-up email.
  rejected: Generic email reply.
  reply: Reply from the recruiting team.
  test: Technical test (SQL)
  interview: Interview with {name}
  interview_location: Video call
  offer: Written offer.
  rejected_after_interview: They went ahead with another candidate.

