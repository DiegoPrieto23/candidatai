# `fits`: match the demo profile (preferred, or Limerick when not on-site);
# `filtered`: the work mode or the place doesn't fit (on-site outside the preferred cities).
locations:
  fits:
    - {city: Dublin, modes: [hybrid, remote]}
    - {city: Cork, modes: [hybrid, remote]}
    - {city: Galway, modes: [hybrid, remote]}
    - {city: Limerick, modes: [hybrid, remote]}
    - {city: Ireland, modes: [remote]}
  filtered:
    - {city: Berlin, modes: [onsite]}
    - {city: Amsterdam, modes: [onsite]}
    - {city: Limerick, modes: [onsite]}

roles:
  - title: Data Engineer
    variants: [Data Engineer, Data Engineer (Snowflake), Data Platform Engineer]
    fit: good
    seniority: [junior, mid]
    years: [null, 1, 2, 3]
    must: [Python, SQL, Snowflake, ETL, Apache Airflow]
    nice: [dbt, Docker, AWS, Power BI]
    responsibilities:
      - Design and maintain data pipelines in Python
      - Model analytical data in Snowflake
      - Orchestrate daily loads and monitor their quality
      - Document the models and review code
  - title: Analytics Engineer
    variants: [Analytics Engineer, Analytics Engineer (dbt)]
    fit: good
    seniority: [junior, mid]
    years: [null, 2, 3]
    must: [SQL, dbt, Snowflake, Python]
    nice: [Power BI, Dimensional modeling, Looker]
    responsibilities:
      - Build the analytical data model with dbt
      - Define business metrics with product
      - Automate data quality checks
  - title: Data Analyst
    variants: [Data Analyst, Business Data Analyst, Data Analyst (Power BI)]
    fit: good
    seniority: [junior, mid]
    years: [null, 1, 2]
    must: [SQL, Power BI, DAX, Python]
    nice: [Snowflake, Excel, Statistics]
    responsibilities:
      - Build Power BI dashboards for the business
      - Analyse sales and operations and present findings
      - Define KPIs with the business teams
  - title: BI Developer
    variants: [BI Developer, BI Developer (Qlik)]
    fit: weak
    seniority: [mid]
    years: [2, 3]
    must: [Qlik Sense, Tableau, SAP BW, SQL]
    nice: [Oracle, PL/SQL]
    responsibilities:
      - Maintain the corporate reports in Qlik and Tableau
      - Integrate SAP data into the data warehouse
  - title: Data Scientist
    variants: [Data Scientist, Machine Learning Scientist]
    fit: weak
    seniority: [mid]
    years: [2, 3, 4]
    must: [R, PyTorch, Deep Learning, Statistics]
    nice: [Python, Spark]
    responsibilities:
      - Train computer vision models
      - Design experiments and measure their impact
  - title: Backend Developer
    variants: [Backend Developer (Java), Java Backend Engineer]
    fit: weak
    seniority: [junior, mid]
    years: [2, 3]
    must: [Java, Spring Boot, Kubernetes, PostgreSQL]
    nice: [Kafka, AWS]
    responsibilities:
      - Develop Java microservices with Spring Boot
      - Maintain the platform on Kubernetes
  - title: Senior Data Engineer
    variants: [Senior Data Engineer, Lead Data Engineer]
    fit: filtered
    seniority: [senior, lead]
    years: [6, 8]
    must: [Python, Spark, Databricks, Scala]
    nice: [Kafka, Terraform]
    responsibilities:
      - Lead the data platform architecture
      - Mentor a team of five engineers
  - title: Data Engineer (Germany)
    variants: [Data Engineer – Remote DACH]
    fit: filtered
    seniority: [mid]
    years: [3]
    must: [Python, SQL, Azure Data Factory]
    nice: [Databricks]
    languages: [{language: German, level: C1}]
    responsibilities:
      - Build Azure pipelines for German-speaking clients

sources:
