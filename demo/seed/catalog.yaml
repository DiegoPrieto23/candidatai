# Catálogo FICTICIO para `cai demo seed` (fase 12.1). Empresas, personas y ofertas inventadas.
# El generador (backend/app/services/demo.py) combina estas listas con una semilla fija: misma
# entrada, misma demo. Las ofertas se evalúan contra demo/profile.example.yaml.

posting_language: es
second_language: {language: Inglés, level: B2}   # lo que pide el 40 % de las ofertas
job_url: "https://empleo.example.com/{company}/ofertas/{n}"

# Textos fijos del historial de la demo.
texts:
  expired: La oferta se retiró del portal.
  followup: Correo de seguimiento.
  rejected: Respuesta genérica por correo.
  reply: Respuesta de selección.
  test: Prueba técnica (SQL)
  interview: Entrevista con {name}
  interview_location: Videollamada
  offer: Oferta por escrito.
  rejected_after_interview: Siguen con otra candidatura.

# La oferta con la instrucción oculta para IAs (`demo/jobs/02`).
risky_job:
  title: Analytics Engineer
  company: Lonxa Retail Tech
  location: España
  text_file: demo/jobs/02-analytics-engineer.txt
  extraction_file: demo/jobs/02-analytics-engineer.extraction.json

