      must_have_skills: [SQL, Python, Snowflake]
      nice_to_have_skills: [Modelado dimensional, Power BI]
      responsibilities:
        - Modelar los datos de ventas y stock en Snowflake
        - Construir y mantener las transformaciones en SQL y Python
        - Publicar cuadros de mando en Power BI
      domain: retail
      posting_language: es
      application_deadline: null
      red_flags: []
      injection_suspected: false
      injection_excerpt: null
