      Responsabilidades
      - Modelar los datos de ventas y stock en Snowflake.
      - Construir y mantener las transformaciones en SQL y Python.
      - Publicar cuadros de mando en Power BI para tiendas y compras.

      Requisitos
      - Dos años de experiencia con SQL y Python.
      - Experiencia con Snowflake u otro data warehouse en la nube.
      - Inglés B2.

      Se valorará
      - Modelado dimensional.
      - Power BI.

      Ofrecemos contrato indefinido, 34.000-40.000 € brutos al año y horario flexible.
