# Las dos ofertas de la demo que llegan con CV generado y verificado (fase 12.1). Todo FICTICIO.
# El contenido cita solo ids de demo/profile.example.yaml, como haría el rol `writer`.

- job:
    title: Data Engineer
    company: Brétema Analytics
    location: Santiago de Compostela
    text_file: demo/jobs/01-data-engineer.txt
    extraction_file: demo/jobs/01-data-engineer.extraction.json
  content:
    language: es
    subtitle: Data Engineer · Python · SQL · Snowflake
    summary: >-
      Data Engineer con tres años construyendo pipelines ETL y modelos analíticos sobre Snowflake
      para clientes de retail y banca, entre la ingeniería y el negocio.
    experience:
      - experience_id: exp-norteconsulting
        bullets:
          - text: Migré 40 procesos ETL de SSIS a Python sobre Snowflake (-35 % en tiempo de carga nocturna).
            evidence: [exp-norteconsulting/a1]
          - text: Diseñé el modelo dimensional de ventas y stock usado por 3 equipos de negocio.
            evidence: [exp-norteconsulting/a2]
      - experience_id: exp-datagal
        bullets:
          - text: Automaticé informes semanales en Power BI (6 h/semana ahorradas a operaciones).
            evidence: [exp-datagal/a1]
          - text: Participé en la creación de pipelines de ingesta de datos de sensores en Python.
            evidence: [exp-datagal/a2]
    projects:
      - project_id: prj-tfg
        bullets:
          - text: Detección de anomalías en series temporales de consumo de 500 hogares.
            evidence: [prj-tfg]
    skills:
      - {group: Lenguajes, items: [Python, SQL]}
      - {group: Datos, items: [Snowflake, ETL, Modelado dimensional, dbt]}
      - {group: BI y herramientas, items: [Power BI, Docker]}
    education_ids: [edu-grado]
    certification_ids: [cert-aws-ccp]
    languages:
      - {language: Español, level: Nativo}
      - {language: Inglés, level: B2}
    keywords_targeted: [Python, SQL, Snowflake, dbt, Power BI]

