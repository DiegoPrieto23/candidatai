[project]
name = "candidatai"
version = "0.3.0"
description = "App local para gestionar una búsqueda de empleo."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "alembic",
    "pydantic>=2.12",  # `Field(exclude_if=…)` del perfil (fase 25.2)
    "pydantic-settings",
    "typer",
    "httpx",
    "pyyaml",
    "trafilatura>=2.2.0",
    "rapidfuzz>=3.14.6",
    "lxml>=6.1.3",
    "mcp>=2.2,<3",
    "docxtpl>=0.20.2",
    "pypdf>=6.21.2",
    "pillow>=13.0.0",
    "pypdfium2>=5.13.0",
    "python-multipart>=0.0.20",
    "ruamel.yaml>=0.18",
    "playwright>=1.63.0",
    "numpy>=2.5.3",
    "apscheduler>=3.11,<4",
    "tzdata>=2026.4",
]

[project.optional-dependencies]
# Similitud semántica del matching. Trae torch: `uv sync --extra matching`.
matching = ["sentence-transformers>=3"]
# Conversión a PDF con Microsoft Word si no hay LibreOffice (solo Windows): `uv sync --extra word`.
word = ["docx2pdf>=0.1.8; sys_platform == 'win32'"]

[project.scripts]
cai = "app.cli:app"
cai-mcp = "app.mcp.server:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "respx",
]

[tool.uv]
# Dependencias indirectas fijadas por debajo de su siguiente versión mayor: las mayores sin
# vulnerabilidad se suben aparte, probándolas, no al poner el lock al día. Revísalas al subir la
# librería que las trae.
constraint-dependencies = [
    "huggingface-hub<2",  # la trae sentence-transformers (extra matching)
    "pyee<14",  # la trae playwright
    "python-dateutil<3",  # la traen trafilatura y htmldate
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Migraciones autogeneradas: líneas largas de restricciones con nombre.
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
# La carpeta `alembic/` del proyecto no debe hacer que ruff trate el paquete como propio.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["layout: con la comprobación de maquetación del PDF encendida (fase 25.5)"]
