[project]
name = "job-hunter"
version = "0.1.0"
description = "App local para gestionar una búsqueda de empleo."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "typer",
    "httpx",
    "pyyaml",
]

[project.scripts]
jh = "app.cli:app"
jh-mcp = "app.mcp.server:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "respx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Migraciones autogeneradas: líneas largas de restricciones con nombre.
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
# La carpeta `alembic/` del proyecto no debe hacer que ruff trate el paquete como propio.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
