<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Acme - Backend Engineer (ficticia)</title></head>
<body>
<form id="application-form" action="/lever/submit" method="post" enctype="multipart/form-data">
  <h4>Submit your application</h4>
  <label>Resume/CV ✱ <input type="file" name="resume" required></label>
  <label>Full name ✱ <input type="text" name="name" required></label>
  <label>Email ✱ <input type="email" name="email" required></label>
  <label>Phone <input type="text" name="phone"></label>
  <label>Current company <input type="text" name="org"></label>
  <label>LinkedIn URL <input type="text" name="urls[LinkedIn]"></label>
  <label>GitHub URL <input type="text" name="urls[GitHub]"></label>
  <fieldset>
    <legend>Will you now or in the future require visa sponsorship? ✱</legend>
    <label><input type="radio" name="cards[sponsor]" value="Yes" required> Yes</label>
    <label><input type="radio" name="cards[sponsor]" value="No"> No</label>
  </fieldset>
  <div class="application-label">Additional information</div>
  <textarea name="comments" placeholder="Add a cover letter or anything else you want to share."></textarea>
  <button type="submit" class="template-btn-submit">Submit application</button>
</form>
</body></html>
