<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Apply (ficticia)</title></head>
<body>
<form id="f" action="/autosubmit/submit" method="post">
  <label for="email">Email *</label><input id="email" name="email" type="email" required>
  <label for="cv">Resume *</label><input type="file" id="cv" name="cv" required>
  <button type="submit">Submit</button>
</form>
<script>
  // Una web que intenta enviar sola en cuanto hay correo: el bloqueo debe impedirlo.
  document.getElementById('email').addEventListener('input', () => {
    const f = document.getElementById('f');
    f.requestSubmit();
    f.submit();
  });
</script>
</body></html>
